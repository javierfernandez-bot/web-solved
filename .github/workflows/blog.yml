# =========================================================
# Regenera el blog desde WordPress y commitea los cambios.
#
# Se dispara de tres formas, de más a menos fiable:
#   - repository_dispatch (tipo `wp-published`): el Publicador de Make lo llama
#     nada más publicar en WordPress. Es la vía buena: el post está en la web a
#     los ~3 min, sin depender de que GitHub respete un cron.
#   - schedule: tres pasadas de seguridad al día. GitHub retrasa y a veces se
#     salta directamente los crons de los repos gratuitos, así que no basta con
#     una sola. El build es idempotente: pasar de más no rompe nada.
#   - workflow_dispatch: botón manual en la pestaña "Actions".
#
# No despliega nada raro: hace push a main y GitHub Pages publica como con
# cualquier otro commit.
# =========================================================
name: Rebuild blog

on:
  workflow_dispatch: {}          # botón manual en la pestaña Actions (siempre disponible)
  repository_dispatch:
    types: [wp-published]        # lo dispara Make justo después de publicar en WP
  schedule:
    # El Publicador de Make publica en WP a las 07:00 España (05:00 UTC). Usamos
    # minuto impar porque GitHub encola peor los crons en el minuto :00. El cron
    # es fijo en UTC (en invierno cae 1 h antes en hora española).
    - cron: '23 5 * * *'    # ~07:23 España (verano) — pasada principal
    - cron: '23 7 * * *'    # ~09:23 España — refuerzo si la primera se retrasa/salta
    - cron: '23 11 * * *'   # ~13:23 España — última red por si el edge de WP estuvo caído

permissions:
  contents: write                # para commitear el /blog regenerado

concurrency:
  group: rebuild-blog
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # El script ya reintenta cada petición ~1 min (scripts/lib/net.mjs). Esto
      # cubre el caso peor: que el edge de Hostinger esté rechazando conexiones
      # durante varios minutos seguidos. Entre intentos hay 2 min de margen.
      # `continue-on-error` no significa "da igual que falle": el veredicto lo da el
      # paso siguiente, que distingue un fallo nuestro de que Hostinger no responda.
      - name: Generar el blog
        id: build
        continue-on-error: true
        env:
          # WordPress (CMS/API) vive en trysolved.es; el sitio estático es trysolved.com.
          WP_API_BASE: https://trysolved.es/wp-json/wp/v2
        run: |
          for intento in 1 2 3; do
            if npm run build:blog; then
              exit 0
            fi
            if [ "$intento" -lt 3 ]; then
              echo "::warning::build:blog falló (intento $intento/3). Reintento en 2 min."
              sleep 120
            fi
          done
          echo "build:blog falló 3 veces seguidas."
          exit 1

      # ¿De quién es el fallo? Sin esto, cada caída de unos minutos del edge de
      # Hostinger mandaba un correo de "workflow failed" que la pasada siguiente
      # ya había arreglado. Seis de los últimos sesenta runs fueron eso, y a base
      # de correos que no había que mirar se pierde el hábito de mirarlos — que es
      # justo lo que necesita la alarma de verdad (el Vigilante del blog).
      #
      # Así que sondeamos WordPress justo después de fallar:
      #   - WordPress contesta  → el build está roto de verdad → rojo, correo, a mirarlo.
      #   - WordPress no contesta → no había nada que hacer → verde con aviso; la
      #     siguiente pasada del cron lo recupera sola. Si la caída dura de verdad,
      #     el Vigilante (que también pega a WordPress) es quien tiene que gritar.
      - name: ¿Fallo nuestro o WordPress caído?
        if: steps.build.outcome == 'failure'
        run: |
          echo "== DNS =="
          getent ahosts trysolved.es || true

          echo "== 5 peticiones a la WP API =="
          ok=0
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null --max-time 20 \
              -w "%{http_code}" "https://trysolved.es/wp-json/wp/v2/posts?per_page=1" \
              || echo "000")
            echo "  intento $i: code=$code"
            [ "$code" = "200" ] && ok=$((ok + 1))
            sleep 5
          done
          echo "WordPress respondió 200 en $ok de 5 intentos."

          # 4 de 5: WordPress puede parpadear justo mientras sondeamos. Pedimos que
          # esté claramente sano antes de acusar al build.
          if [ "$ok" -ge 4 ]; then
            echo "::error title=El build del blog está roto::WordPress responde con normalidad ($ok/5), así que el fallo de build:blog es nuestro. Mira el log del paso anterior."
            {
              echo "### Rebuild blog"
              echo ""
              echo "- ⛔ **build:blog falló con WordPress sano ($ok/5).** Fallo real, revisar el log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::warning title=WordPress no respondía::build:blog falló, pero la WP API solo contestó $ok de 5 veces. Se da por transitorio: lo recupera la siguiente pasada del cron."
          {
            echo "### Rebuild blog"
            echo ""
            echo "- ⚠️ **WordPress no respondía ($ok/5).** No se ha regenerado nada; lo reintenta el cron siguiente."
            echo "- Si el blog acaba de verdad sin publicar, quien avisa es el Vigilante (repo \`seo-loop\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      # Páginas puente para las URLs de la época WordPress que Google sigue
      # teniendo indexadas y que hoy devuelven 404. El mapa está en
      # seo/redirects.json y el generador en scripts/build-redirects.mjs.
      - name: Generar páginas puente de las URLs antiguas
        if: steps.build.outcome == 'success'
        run: npm run build:redirects

      # Enlazado interno: los posts no enlazaban al glosario, las fichas del
      # glosario no enlazaban a nada y no habia ni un CTA a producto en todo el
      # blog. El mapa esta en seo/enlazado.json. Va despues de build:blog porque
      # necesita el /blog ya generado.
      - name: Enlazado interno del blog y del glosario
        if: steps.build.outcome == 'success'
        run: npm run build:enlaces

      - name: Commit si hay cambios
        if: steps.build.outcome == 'success'
        run: |
          git config user.name  "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          # -A en vez de rutas concretas: el build escribe /blog, sitemap.xml y
          # ahora también las páginas puente en la raíz. .gitignore ya excluye
          # node_modules/ y .cache/, lo único generado que no debe commitearse.
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en el blog."
          else
            git commit -m "blog: regeneración automática desde WordPress"
            git push
          fi
